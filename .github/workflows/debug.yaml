name: Debug pnpm leak

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build with keep-failed
        continue-on-error: true
        run: |
          nix build .#dsh --keep-failed --print-build-logs > build.log 2>&1 || true
          tail -20 build.log

      - name: Find the pnpm reference
        run: |
          set +e
          for dir in /nix/store/*deepseek-harness*; do
            if [ -d "$dir" ]; then
              echo "== scanning $dir =="
              grep -rl "pnpm-11.20.0" "$dir" 2>/dev/null | head -5
            fi
          done
          echo "== scanning keep-failed dirs =="
          ls -d /build/nix-build-* 2>/dev/null | head -5
          for dir in /build/nix-build-*; do
            [ -d "$dir" ] || continue
            echo "== $dir =="
            grep -rl "pnpm-11.20.0" "$dir" 2>/dev/null | head -10
          done
